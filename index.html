<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vektorrechnung Zusammenfassung & Übungen</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- MathJax für LaTeX Formeln -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    
    <!-- Custom Theme Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        mocha: {
                            900: '#3e3127',
                            800: '#524336',
                            700: '#6e5a4a',
                            600: '#8c7662',
                            500: '#ab927b',
                        },
                        creme: {
                            100: '#fdfbf7',
                            200: '#f3ece3',
                            300: '#e3d6c8',
                        },
                        gold: {
                            400: '#fbbf24',
                            500: '#f59e0b',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #6e5a4a; /* mocha-700 */
            color: #fdfbf7; /* creme-100 */
        }
        
        .sidebar-scroll::-webkit-scrollbar { width: 6px; }
        .sidebar-scroll::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); border-radius: 4px; }
        .sidebar-scroll::-webkit-scrollbar-thumb { background: #8c7662; border-radius: 4px; }
        
        .animation-fade-in { animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .math-box { overflow-x: auto; overflow-y: hidden; padding-bottom: 0.5rem; }

        canvas { display: block; width: 100%; height: 100%; touch-action: none; }
        
        /* Details/Summary Styling für Übungen */
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }

        /* --- Interaktive Aufgaben --- */
        .int-input {
            background: #3e3127;
            border: 1px solid #8c7662;
            color: #fdfbf7;
            border-radius: 0.5rem;
            padding: 0.5rem;
            text-align: center;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            transition: border-color .15s, box-shadow .15s;
            width: 100%;
        }
        .int-input:focus {
            outline: none;
            border-color: #fbbf24;
            box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.25);
        }
        /* Spinner-Pfeile dezenter machen */
        .int-input::-webkit-outer-spin-button,
        .int-input::-webkit-inner-spin-button { opacity: 0.35; }

        /* Vektor-Eingabe als Spaltenvektor */
        .vec-input {
            display: inline-flex;
            flex-direction: column;
            gap: 0.4rem;
            padding: 0.4rem 0.6rem;
            border-left: 2px solid #ab927b;
            border-right: 2px solid #ab927b;
            border-radius: 6px;
        }
        .vec-input .int-input { width: 4.5rem; }

        /* Antwort-Buttons (Multiple Choice) */
        .choice-opt {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            width: 100%;
            text-align: left;
            background: #3e3127;
            border: 1px solid #6e5a4a;
            color: #f3ece3;
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            cursor: pointer;
            transition: all .15s;
        }
        .choice-opt:hover { background: #524336; border-color: #8c7662; }
        .choice-opt.selected { background: rgba(251,191,36,0.15); border-color: #fbbf24; color: #fbbf24; }
        .choice-opt .dot {
            flex-shrink: 0; width: 1.1rem; height: 1.1rem; border-radius: 9999px;
            border: 2px solid #8c7662; display: inline-block; transition: all .15s;
        }
        .choice-opt.selected .dot { border-color: #fbbf24; background: #fbbf24; box-shadow: inset 0 0 0 3px #3e3127; }

        /* Feedback-Box */
        .feedback { margin-top: 0.75rem; font-weight: 600; min-height: 0; transition: all .2s; }
        .feedback.ok { color: #4ade80; }
        .feedback.bad { color: #fca5a5; }
        .feedback.info { color: #fcd34d; }

        .btn-check {
            background: #f59e0b; color: #3e3127; font-weight: 700;
            padding: 0.55rem 1.4rem; border-radius: 0.6rem; transition: all .15s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.25);
        }
        .btn-check:hover { background: #fbbf24; transform: translateY(-1px); }

        /* sanftes Erscheinen + globale Politur */
        html { scroll-behavior: smooth; }
        ::selection { background: rgba(251, 191, 36, 0.3); }
        .int-card { animation: fadeIn 0.4s ease forwards; }
    </style>
</head>
<body class="flex flex-col md:flex-row h-screen w-full overflow-hidden">

    <nav class="w-full md:w-80 h-1/3 md:h-screen bg-mocha-900 border-b md:border-b-0 md:border-r border-mocha-600 flex flex-col z-20 shadow-xl">
        <div class="p-6 border-b border-mocha-600 bg-mocha-900/50">
            <h1 class="text-2xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-gold-400 to-amber-200">
                Vektorgeometrie
            </h1>
            <p class="text-creme-300 text-sm mt-2 font-medium">Abitur Zusammenfassung & Übungen</p>
        </div>
        
        <div class="flex-1 overflow-y-auto sidebar-scroll p-4 space-y-1.5" id="nav-container">
            <!-- Navigation wird generiert -->
        </div>
    </nav>

    <main class="flex-1 h-2/3 md:h-screen overflow-y-auto p-6 md:p-12 relative bg-mocha-700" id="main-content">
        <!-- Inhalte werden generiert -->
    </main>

    <script>
        // --- Globale Hilfsfunktionen Canvas ---
        function getRealCanvasSize(canvas) {
            const rect = canvas.getBoundingClientRect();
            if (rect.width === 0 || rect.height === 0) return null;
            return { w: rect.width, h: rect.height };
        }

        function drawVecLabel(ctx, prefix, vecName, suffix, x, y, color) {
            ctx.fillStyle = color; ctx.strokeStyle = color; ctx.font = 'bold 16px sans-serif'; ctx.lineWidth = 1.5;
            let cx = x;
            if (prefix) { ctx.fillText(prefix, cx, y); cx += ctx.measureText(prefix).width; }
            if (vecName) {
                ctx.fillText(vecName, cx, y); let w = ctx.measureText(vecName).width; let lineY = y - 14;
                ctx.beginPath(); ctx.moveTo(cx, lineY); ctx.lineTo(cx + w, lineY); ctx.moveTo(cx + w - 3, lineY - 3);
                ctx.lineTo(cx + w, lineY); ctx.lineTo(cx + w - 3, lineY + 3); ctx.stroke(); cx += w;
            }
            if (suffix) { ctx.fillText(suffix, cx, y); }
        }

        function draw3DSystem(ctx, width, height, origin, boxSize) {
            ctx.strokeStyle = 'rgba(140, 118, 98, 0.3)'; ctx.lineWidth = 1;
            const gridStartX = (origin.x % boxSize + boxSize) % boxSize;
            for (let x = gridStartX; x < width; x += boxSize) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke(); }
            const gridStartY = (origin.y % boxSize + boxSize) % boxSize;
            for (let y = gridStartY; y < height; y += boxSize) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke(); }
            ctx.strokeStyle = '#a8a29e'; ctx.fillStyle = '#fdfbf7'; ctx.lineWidth = 2.5;
            const drawArr = (x, y, angle) => {
                ctx.save(); ctx.translate(x, y); ctx.rotate(angle);
                ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-12, -6); ctx.lineTo(-12, 6);
                ctx.fillStyle = '#a8a29e'; ctx.fill(); ctx.restore();
            };
            const maxTicks = 7; 
            const startX2 = origin.x - maxTicks * boxSize - 25; const endX2 = origin.x + maxTicks * boxSize + 25;
            ctx.beginPath(); ctx.moveTo(startX2, origin.y); ctx.lineTo(endX2, origin.y); ctx.stroke(); drawArr(endX2, origin.y, 0); ctx.font = 'bold 16px sans-serif'; ctx.fillText('x₂', endX2 + 5, origin.y - 15);
            const startX3 = origin.y + maxTicks * boxSize + 25; const endX3 = origin.y - maxTicks * boxSize - 25;
            ctx.beginPath(); ctx.moveTo(origin.x, startX3); ctx.lineTo(origin.x, endX3); ctx.stroke(); drawArr(origin.x, endX3, -Math.PI / 2); ctx.fillText('x₃', origin.x - 30, endX3 + 15);
            const startX1_x = origin.x + maxTicks * (boxSize / 2) + 25; const startX1_y = origin.y - maxTicks * (boxSize / 2) - 25; const endX1_x = origin.x - maxTicks * (boxSize / 2) - 25; const endX1_y = origin.y + maxTicks * (boxSize / 2) + 25;
            ctx.beginPath(); ctx.moveTo(startX1_x, startX1_y); ctx.lineTo(endX1_x, endX1_y); ctx.stroke(); drawArr(endX1_x, endX1_y, 3 * Math.PI / 4); ctx.fillText('x₁', endX1_x - 25, endX1_y + 15);
            ctx.font = '12px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineWidth = 1.5;
            for (let i = -maxTicks; i <= maxTicks; i++) {
                if (i === 0) continue;
                let tx2 = origin.x + i * boxSize; ctx.beginPath(); ctx.moveTo(tx2, origin.y - 4); ctx.lineTo(tx2, origin.y + 4); ctx.stroke(); ctx.fillText(i, tx2, origin.y + 18);
                let ty3 = origin.y - i * boxSize; ctx.beginPath(); ctx.moveTo(origin.x - 4, ty3); ctx.lineTo(origin.x + 4, ty3); ctx.stroke(); ctx.fillText(i, origin.x - 18, ty3);
                let tx1 = origin.x - i * (boxSize / 2); let ty1 = origin.y + i * (boxSize / 2); ctx.beginPath(); ctx.moveTo(tx1 - 3, ty1 - 3); ctx.lineTo(tx1 + 3, ty1 + 3); ctx.stroke(); ctx.fillText(i, tx1, ty1 - 14);
            }
            ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
        }

        // --- Themen ---
        const topics = [
            { id: '3d-koord', title: 'Das 3D-Koordinatensystem' },
            { id: 'abstand', title: 'Abstand zwischen Punkten' },
            { id: 'vektorbegriff', title: 'Der Vektorbegriff' },
            { id: 'rechnen-vektoren', title: 'Rechnen mit Vektoren' }, 
            { id: 'kollinear', title: 'Kollinearität / Lineare Abhängigkeit' },
            { id: 'gerade-param', title: 'Die Gerade in Parameterform' },
            { id: 'lage-geraden', title: 'Lagebeziehungen zwischen Geraden' },
            { id: 'ebene-param', title: 'Die Ebene in Parameterform' },
            { id: 'gleichungssysteme', title: 'Lineare Gleichungssysteme' },
            { id: 'lage-gerade-ebene', title: 'Lage Gerade und Ebene' },
            { id: 'skalarprodukt', title: 'Das Skalarprodukt' },
            { id: 'winkel-geraden', title: 'Winkel zwischen Geraden' },
            { id: 'winkel-gerade-ebene', title: 'Winkel Gerade und Ebene' },
            { id: 'ebene-normalen', title: 'Ebenen in Normalenform' },
            { id: 'ebene-koordinaten', title: 'Ebenen in Koordinatenform' },
            { id: 'spurpunkte', title: 'Spurpunkte von Ebenen' },
            { id: 'abstandsprobleme', title: 'Abstandsprobleme' } 
        ];

        let activeTopicId = '3d-koord';

        // --- UI Hilfsfunktionen ---
        function renderNav() {
            const container = document.getElementById('nav-container');
            container.innerHTML = '';
            topics.forEach((topic, index) => {
                const btn = document.createElement('button');
                const isActive = topic.id === activeTopicId;
                btn.className = `w-full text-left px-4 py-3 rounded-xl transition-all duration-200 flex items-start gap-3 group ${isActive ? 'bg-gold-500/20 text-gold-400 border border-gold-500/30 shadow-inner' : 'text-creme-200 hover:bg-mocha-800 hover:text-white border border-transparent'}`;
                btn.innerHTML = `<span class="flex-shrink-0 w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold ${isActive ? 'bg-gold-500 text-mocha-900 shadow-md' : 'bg-mocha-700 text-creme-300 group-hover:bg-mocha-600'}">${index + 1}</span><span class="font-medium mt-0.5 leading-tight">${topic.title}</span>`;
                btn.onclick = () => { 
                    activeTopicId = topic.id; 
                    renderNav(); 
                    renderContent(); 
                    document.getElementById('main-content').scrollTop = 0; // Scroll nach oben!
                };
                container.appendChild(btn);
            });
        }

        // --- Übungsaufgaben Renderer ---
        function renderExercises(exList) {
            let html = `<div class="mt-16 bg-mocha-800 p-6 md:p-8 rounded-2xl shadow-lg border border-mocha-600">
                <h3 class="text-2xl font-bold text-gold-400 mb-6 border-b border-mocha-600 pb-2">Übungsaufgaben</h3>
                <div class="space-y-6">`;
            exList.forEach((ex, i) => {
                html += `
                    <div class="bg-mocha-900 p-5 rounded-xl border border-mocha-600 shadow-inner">
                        <h4 class="font-bold text-white mb-3">Aufgabe ${i+1}</h4>
                        <div class="text-creme-200 mb-4 text-sm md:text-base">${ex.q}</div>
                        <details class="group">
                            <summary class="cursor-pointer font-bold text-amber-500 hover:text-amber-400 list-none flex items-center gap-2 select-none bg-mocha-800/50 p-3 rounded-lg border border-mocha-700/50">
                                <svg class="w-5 h-5 transition-transform group-open:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                                Musterlösung anzeigen
                            </summary>
                            <div class="mt-4 pt-4 border-t border-mocha-700 text-creme-200 text-sm md:text-base space-y-3">
                                ${ex.a}
                            </div>
                        </details>
                    </div>`;
            });
            html += `</div></div>`;
            return html;
        }

        // Sprungnavigation innerhalb eines Themas (Haupt-Container scrollt, nicht das Fenster)
        function jumpTo17(id) {
            const el = document.getElementById(id);
            const main = document.getElementById('main-content');
            if (!el || !main) return;
            const target = main.scrollTop + el.getBoundingClientRect().top - main.getBoundingClientRect().top - 16;
            main.scrollTo({ top: target, behavior: 'smooth' });
            // Fallback, falls der Browser kein sanftes Scrollen animiert
            setTimeout(() => { if (Math.abs(main.scrollTop - target) > 4) main.scrollTop = target; }, 450);
        }

        // --- Interaktive Aufgaben (mit Auto-Korrektur) ---
        const INT_STORE = {};

        function renderInteractive(list, key) {
            INT_STORE[key] = list;
            let html = `<div class="max-w-5xl mx-auto"><div class="mt-10 bg-mocha-800 p-6 md:p-8 rounded-2xl shadow-lg border border-mocha-600">
                <h3 class="text-2xl font-bold text-gold-400 mb-2 flex items-center gap-2">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    Interaktive Aufgaben
                </h3>
                <p class="text-creme-300 text-sm mb-6">Trage deine Lösung ein und klicke auf <strong class="text-gold-300">Prüfen</strong> – du bekommst sofort Rückmeldung.</p>
                <div class="space-y-6">`;
            list.forEach((ex, i) => {
                html += `<div class="int-card bg-mocha-900 p-5 rounded-xl border border-mocha-600 shadow-inner">
                    <h4 class="font-bold text-white mb-3">Aufgabe ${i + 1}</h4>
                    <div class="text-creme-200 mb-4 text-sm md:text-base">${ex.q}</div>
                    <div class="mb-1">${renderIntInputs(ex, key, i)}</div>
                    <div class="flex flex-wrap items-center gap-3 mt-4">
                        <button class="btn-check" onclick="checkInteractive('${key}',${i})">Prüfen</button>
                        <button class="text-sm text-creme-300 hover:text-white underline underline-offset-2" onclick="resetInteractive('${key}',${i})">Zurücksetzen</button>
                    </div>
                    <div id="fb_${key}_${i}" class="feedback"></div>`;
                if (ex.a) {
                    html += `<details class="group mt-4">
                        <summary class="cursor-pointer font-bold text-amber-500 hover:text-amber-400 list-none flex items-center gap-2 select-none bg-mocha-800/50 p-3 rounded-lg border border-mocha-700/50">
                            <svg class="w-5 h-5 transition-transform group-open:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                            Lösungsweg anzeigen
                        </summary>
                        <div class="mt-4 pt-4 border-t border-mocha-700 text-creme-200 text-sm md:text-base space-y-3">${ex.a}</div>
                    </details>`;
                }
                html += `</div>`;
            });
            html += `</div></div></div>`;
            return html;
        }

        function renderIntInputs(ex, key, i) {
            if (ex.type === 'vec') {
                const labels = ['x₁', 'x₂', 'x₃'];
                let cells = '';
                for (let j = 0; j < 3; j++) {
                    cells += `<input type="text" inputmode="decimal" id="in_${key}_${i}_${j}" class="int-input" placeholder="${labels[j]}" onkeydown="if(event.key==='Enter')checkInteractive('${key}',${i})">`;
                }
                return `<div class="flex items-center gap-3"><span class="text-gold-400 font-bold text-lg">${ex.label || '\\(\\vec{x}=\\)'}</span><div class="vec-input">${cells}</div></div>`;
            }
            if (ex.type === 'num') {
                return `<div class="flex items-center gap-3 flex-wrap">
                    <span class="text-creme-100 font-semibold">${ex.label || 'Ergebnis ='}</span>
                    <input type="text" inputmode="decimal" id="in_${key}_${i}_0" class="int-input" style="max-width:9rem" placeholder="?" onkeydown="if(event.key==='Enter')checkInteractive('${key}',${i})">
                    ${ex.unit ? `<span class="text-creme-300">${ex.unit}</span>` : ''}
                </div>`;
            }
            if (ex.type === 'multi') {
                let cells = '';
                ex.fields.forEach((f, j) => {
                    cells += `<div class="flex items-center gap-2">
                        <span class="text-gold-400 font-semibold">${f}</span>
                        <input type="text" inputmode="decimal" id="in_${key}_${i}_${j}" class="int-input" style="max-width:6.5rem" placeholder="?" onkeydown="if(event.key==='Enter')checkInteractive('${key}',${i})">
                    </div>`;
                });
                return `<div class="flex flex-wrap items-center gap-4">${cells}</div>`;
            }
            if (ex.type === 'choice') {
                let opts = '';
                ex.options.forEach((opt, j) => {
                    opts += `<button type="button" class="choice-opt" id="opt_${key}_${i}_${j}" onclick="selectChoice('${key}',${i},${j})">
                        <span class="dot"></span><span>${opt}</span>
                    </button>`;
                });
                return `<div class="flex flex-col gap-2 max-w-xl">${opts}</div>`;
            }
            return '';
        }

        const CHOICE_SEL = {};
        function selectChoice(key, i, j) {
            CHOICE_SEL[`${key}_${i}`] = j;
            const ex = INT_STORE[key][i];
            ex.options.forEach((_, k) => {
                const el = document.getElementById(`opt_${key}_${i}_${k}`);
                if (el) el.classList.toggle('selected', k === j);
            });
        }

        function setFeedback(key, i, cls, msg) {
            const fb = document.getElementById(`fb_${key}_${i}`);
            if (!fb) return;
            fb.className = 'feedback ' + cls;
            fb.innerHTML = msg;
            if (typeof MathJax !== 'undefined' && MathJax.typesetPromise) {
                MathJax.typesetPromise([fb]).catch(() => {});
            }
        }

        function resetInteractive(key, i) {
            const ex = INT_STORE[key][i];
            if (ex.type === 'choice') {
                delete CHOICE_SEL[`${key}_${i}`];
                ex.options.forEach((_, k) => {
                    const el = document.getElementById(`opt_${key}_${i}_${k}`);
                    if (el) el.classList.remove('selected');
                });
            } else {
                const n = ex.type === 'vec' ? 3 : (ex.type === 'multi' ? ex.fields.length : 1);
                for (let j = 0; j < n; j++) {
                    const el = document.getElementById(`in_${key}_${i}_${j}`);
                    if (el) el.value = '';
                }
            }
            setFeedback(key, i, '', '');
        }

        function checkInteractive(key, i) {
            const ex = INT_STORE[key][i];
            const tol = ex.tol != null ? ex.tol : 1e-6;
            const okMsg = ex.okMsg || 'Richtig! ✓';
            const badMsg = ex.badMsg || 'Noch nicht ganz – rechne nochmal nach oder schau dir den Lösungsweg an.';

            if (ex.type === 'choice') {
                const sel = CHOICE_SEL[`${key}_${i}`];
                if (sel == null) { setFeedback(key, i, 'info', 'Bitte zuerst eine Antwort auswählen.'); return; }
                if (sel === ex.correct) setFeedback(key, i, 'ok', okMsg);
                else setFeedback(key, i, 'bad', badMsg);
                return;
            }

            const n = ex.type === 'vec' ? 3 : (ex.type === 'multi' ? ex.fields.length : 1);
            const vals = [];
            for (let j = 0; j < n; j++) {
                const el = document.getElementById(`in_${key}_${i}_${j}`);
                const raw = el ? el.value.trim().replace(',', '.') : '';
                if (raw === '') { setFeedback(key, i, 'info', 'Bitte alle Felder ausfüllen.'); return; }
                vals.push(parseFloat(raw));
            }
            if (vals.some(isNaN)) { setFeedback(key, i, 'info', 'Bitte nur Zahlen eingeben.'); return; }

            const answer = Array.isArray(ex.answer) ? ex.answer : [ex.answer];
            const correct = vals.every((v, j) => Math.abs(v - answer[j]) <= tol);
            setFeedback(key, i, correct ? 'ok' : 'bad', correct ? okMsg : badMsg);
        }

        function renderContent() {
            const mainDiv = document.getElementById('main-content');
            
            if (activeTopicId === '3d-koord') mainDiv.innerHTML = getTopic1HTML();
            else if (activeTopicId === 'abstand') mainDiv.innerHTML = getTopic2HTML();
            else if (activeTopicId === 'vektorbegriff') mainDiv.innerHTML = getTopic3HTML();
            else if (activeTopicId === 'rechnen-vektoren') mainDiv.innerHTML = getTopic4HTML(); 
            else if (activeTopicId === 'kollinear') mainDiv.innerHTML = getTopic5HTML();
            else if (activeTopicId === 'gerade-param') mainDiv.innerHTML = getTopic6HTML();
            else if (activeTopicId === 'lage-geraden') mainDiv.innerHTML = getTopic7HTML();
            else if (activeTopicId === 'ebene-param') mainDiv.innerHTML = getTopic8HTML();
            else if (activeTopicId === 'gleichungssysteme') mainDiv.innerHTML = getTopic9HTML();
            else if (activeTopicId === 'lage-gerade-ebene') mainDiv.innerHTML = getTopic10HTML();
            else if (activeTopicId === 'skalarprodukt') mainDiv.innerHTML = getTopic11HTML();
            else if (activeTopicId === 'winkel-geraden') mainDiv.innerHTML = getTopic12HTML();
            else if (activeTopicId === 'winkel-gerade-ebene') mainDiv.innerHTML = getTopic13HTML();

                                    <canvas id="distLineCanvas" class="absolute top-0 left-0 w-full h-full"></canvas>
                                </div>
                            </div>
                        </div>

                        <!-- Beispiel B -->
                        <div class="bg-mocha-900 border-2 border-gold-500/30 rounded-2xl p-6 md:p-8 mb-8 shadow-lg">
                            <div class="flex items-center gap-2 mb-4">
                                <span class="bg-gold-500 text-mocha-900 font-bold px-3 py-1 rounded-lg text-sm">Beispiel B</span>
                                <span class="text-creme-200 text-sm">beide Wege am selben Zahlenmaterial</span>
                            </div>
                            <p class="text-creme-100 mb-5">Abstand von $P(4|5|3)$ zur Geraden $g: \\vec{x} = \\begin{pmatrix} 1 \\\\ 2 \\\\ 3 \\end{pmatrix} + r \\begin{pmatrix} 2 \\\\ 1 \\\\ -2 \\end{pmatrix}$</p>

                            <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
                                <div class="bg-mocha-800 p-5 rounded-xl border-l-4 border-blue-500">
                                    <strong class="text-blue-400 block mb-3">Weg B1: Hilfsebene</strong>
                                    <p class="text-sm text-creme-200 mb-2">$E_H$ hat $\\vec{n} = \\vec{u} = \\begin{pmatrix} 2 \\\\ 1 \\\\ -2 \\end{pmatrix}$ und geht durch $P$:</p>
                                    <div class="text-sm font-mono bg-mocha-900 p-3 rounded-lg border border-mocha-600 text-creme-100 mb-3">
                                        <div>$2x_1 + x_2 - 2x_3 = 2(4)+5-2(3) = 7$</div>
                                    </div>
                                    <p class="text-sm text-creme-200 mb-2">Gerade einsetzen:</p>
                                    <div class="text-sm font-mono bg-mocha-900 p-3 rounded-lg border border-mocha-600 text-creme-100 space-y-1">
                                        <div>$2(1+2r) + (2+r) - 2(3-2r) = 7$</div>
                                        <div>$-2 + 9r = 7 \\Rightarrow r = 1$</div>
                                    </div>
                                </div>

                                <div class="bg-mocha-800 p-5 rounded-xl border-l-4 border-green-500">
                                    <strong class="text-green-400 block mb-3">Weg B2: Laufpunkt</strong>
                                    <p class="text-sm text-creme-200 mb-2">Allgemeiner Punkt minus $P$:</p>
                                    <div class="math-box text-center text-creme-100 text-sm mb-2">$$\\vec{f}(r) - \\vec{p} = \\begin{pmatrix} 2r-3 \\\\ r-3 \\\\ -2r \\end{pmatrix}$$</div>
                                    <p class="text-sm text-creme-200 mb-2">Skalarprodukt mit $\\vec{u}$ gleich null setzen:</p>
                                    <div class="text-sm font-mono bg-mocha-900 p-3 rounded-lg border border-mocha-600 text-creme-100 space-y-1">
                                        <div>$2(2r-3) + (r-3) + (-2)(-2r) = 0$</div>
                                        <div>$9r - 9 = 0 \\Rightarrow r = 1$</div>
                                    </div>
                                    <p class="text-xs text-creme-300 mt-2">Gleiches $r$ &ndash; nur ohne Umweg über eine Ebene.</p>
                                </div>
                            </div>

                            <div class="bg-mocha-800 p-5 rounded-xl border-l-4 border-gold-500 mt-5">
                                <strong class="text-gold-400 block mb-2">Gemeinsamer Abschluss</strong>
                                <div class="math-box text-center text-creme-100">$$\\vec{f} = \\begin{pmatrix} 1 \\\\ 2 \\\\ 3 \\end{pmatrix} + 1 \\cdot \\begin{pmatrix} 2 \\\\ 1 \\\\ -2 \\end{pmatrix} = \\begin{pmatrix} 3 \\\\ 3 \\\\ 1 \\end{pmatrix} \\quad \\Rightarrow \\quad F(3|3|1)$$</div>
                                <div class="math-box text-center text-creme-100 mt-2">$$\\vec{PF} = \\begin{pmatrix} -1 \\\\ -2 \\\\ -2 \\end{pmatrix} \\quad \\Rightarrow \\quad d = \\sqrt{1+4+4} = 3$$</div>
                            </div>
                        </div>

                        <!-- B3 Kreuzprodukt -->
                        <div class="bg-mocha-800 p-6 md:p-8 rounded-2xl shadow-lg border border-mocha-600">
                            <h4 class="text-xl font-bold text-amber-500 mb-4">B3 &ndash; Die Flächenformel (Kreuzprodukt)</h4>
                            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 items-center">
                                <div>
                                    <p class="text-sm text-creme-200 mb-4">Spannt man aus dem Richtungsvektor $\\vec{u}$ und dem Verbindungsvektor $\\vec{AP}$ ein <strong class="text-white">Parallelogramm</strong> auf, so ist dessen Flächeninhalt $|\\vec{AP} \\times \\vec{u}|$.</p>
                                    <p class="text-sm text-creme-200 mb-4">Für jedes Parallelogramm gilt aber auch: <strong class="text-white">Fläche = Grundseite $\\cdot$ Höhe</strong>. Die Grundseite ist $|\\vec{u}|$, die Höhe ist genau der gesuchte Abstand $d$. Umstellen liefert:</p>
                                    <div class="bg-amber-900/30 border-l-4 border-amber-500 p-4 rounded-r-xl border-y border-r border-amber-500/30">
                                        <div class="math-box text-center text-gold-300 font-bold text-lg">$$d = \\frac{|\\vec{AP} \\times \\vec{u}|}{|\\vec{u}|}$$</div>
                                    </div>
                                    <p class="text-xs text-creme-300 mt-3">$A$ ist der Stützpunkt der Geraden. Vorteil: eine einzige Formel, kein Gleichungslösen. Nachteil: <strong class="text-white">kein Lotfußpunkt</strong>.</p>
                                </div>
                                <div class="bg-mocha-900 rounded-xl border border-mocha-600 p-5">
                                    <svg viewBox="0 0 300 190" class="w-full">
                                        <defs>
                                            <marker id="arrPL1" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#fbbf24" /></marker>
                                            <marker id="arrPL2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4ade80" /></marker>
                                        </defs>
                                        <path d="M 40 150 L 200 150 L 260 60 L 100 60 Z" fill="rgba(251,191,36,0.12)" stroke="#8c7662" stroke-width="1.5" stroke-dasharray="4,4"/>
                                        <line x1="40" y1="150" x2="200" y2="150" stroke="#fbbf24" stroke-width="3" marker-end="url(#arrPL1)"/>
                                        <line x1="40" y1="150" x2="100" y2="60" stroke="#4ade80" stroke-width="3" marker-end="url(#arrPL2)"/>
                                        <line x1="100" y1="60" x2="100" y2="150" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="5,4"/>
                                        <rect x="100" y="138" width="12" height="12" fill="none" stroke="#f43f5e" stroke-width="1.5"/>
                                        <circle cx="40" cy="150" r="4" fill="#fdfbf7"/>
                                        <circle cx="100" cy="60" r="4" fill="#fdfbf7"/>
                                        <text x="26" y="168" fill="#fdfbf7" font-size="13" font-weight="bold">A</text>
                                        <text x="92" y="52" fill="#fdfbf7" font-size="13" font-weight="bold">P</text>
                                        <text x="150" y="168" fill="#fbbf24" font-size="13" font-weight="bold">u</text>
                                        <text x="52" y="98" fill="#4ade80" font-size="13" font-weight="bold">AP</text>
                                        <text x="110" y="110" fill="#f43f5e" font-size="14" font-weight="bold">d</text>
                                        <text x="180" y="105" fill="#c9b8a4" font-size="11">Fläche = |AP × u|</text>
                                    </svg>
                                </div>
                            </div>
                            <div class="bg-mocha-900 p-4 rounded-xl border border-mocha-600 mt-5">
                                <strong class="text-white block mb-2 text-sm">Kontrolle am Beispiel B</strong>
                                <p class="text-sm text-creme-200">Mit $A(1|2|3)$, $P(4|5|3)$ ist $\\vec{AP} = \\begin{pmatrix} 3 \\\\ 3 \\\\ 0 \\end{pmatrix}$ und</p>
                                <div class="math-box text-center text-creme-100 mt-2">$$\\vec{AP} \\times \\vec{u} = \\begin{pmatrix} 3 \\\\ 3 \\\\ 0 \\end{pmatrix} \\times \\begin{pmatrix} 2 \\\\ 1 \\\\ -2 \\end{pmatrix} = \\begin{pmatrix} -6 \\\\ 6 \\\\ -3 \\end{pmatrix}, \\quad |\\vec{AP} \\times \\vec{u}| = 9$$</div>
                                <div class="math-box text-center text-gold-300 font-bold mt-2">$$d = \\frac{9}{|\\vec{u}|} = \\frac{9}{3} = 3 \\quad \\checkmark$$</div>
                            </div>
                        </div>
                    </div>

                    <!-- ================= C: Parallele Geraden ================= -->
                    <div class="mb-16" id="sec17C">
                        <h3 class="text-2xl font-bold text-white mb-2 border-b border-mocha-600 pb-2">C. Abstand paralleler Geraden</h3>
                        <p class="text-creme-300 text-sm mb-6">Der einfachste Fall &ndash; wenn man den einen Gedanken erst mal hat.</p>

                        <div class="bg-mocha-800 p-6 md:p-8 rounded-2xl shadow-lg border border-mocha-600 mb-8">
                            <div class="bg-mocha-900 p-5 rounded-xl border-l-4 border-gold-500 mb-6 shadow-inner">
                                <strong class="text-white block mb-2 text-lg">Die entscheidende Beobachtung</strong>
                                <p class="text-sm text-creme-200">Parallele Geraden haben <strong class="text-white">überall denselben Abstand</strong>. Man darf sich also auf $h$ einen <strong class="text-white">beliebigen Punkt $B$ herauspicken</strong> &ndash; am bequemsten den Stützpunkt &ndash; und dessen Abstand zur Geraden $g$ berechnen. Damit ist das Problem auf Abschnitt B zurückgeführt.</p>
                            </div>

                            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                <div class="bg-mocha-900 p-5 rounded-xl border border-mocha-600">
                                    <h4 class="font-bold text-green-400 mb-3">C1 &ndash; Über das Skalarprodukt</h4>
                                    <p class="text-sm text-creme-200 mb-3">Wir suchen auf $g$ den Lotfußpunkt $F(r)$, für den der Verbindungsvektor zu $B$ senkrecht auf der gemeinsamen Richtung $\\vec{u}$ steht:</p>
                                    <div class="bg-mocha-800 p-3 rounded-lg border border-mocha-600">
                                        <div class="math-box text-center text-gold-300 font-bold">$$\\left( \\vec{f}(r) - \\vec{b} \\right) \\cdot \\vec{u} = 0$$</div>
                                    </div>
                                    <p class="text-sm text-creme-200 mt-3">Eine Gleichung, eine Unbekannte. Danach $d = |\\vec{BF}|$.</p>
                                    <p class="text-xs text-gold-300 mt-2"><strong>Liefert den Lotfußpunkt mit.</strong></p>
                                </div>

                                <div class="bg-mocha-900 p-5 rounded-xl border border-mocha-600">
                                    <h4 class="font-bold text-amber-400 mb-3">C2 &ndash; Über die Fläche</h4>
                                    <p class="text-sm text-creme-200 mb-3">$\\vec{AB}$ (von Stützpunkt zu Stützpunkt) und $\\vec{u}$ spannen ein Parallelogramm auf. Seine Höhe ist der Geradenabstand:</p>
                                    <div class="bg-mocha-800 p-3 rounded-lg border border-mocha-600">
                                        <div class="math-box text-center text-gold-300 font-bold">$$d = \\frac{|\\vec{AB} \\times \\vec{u}|}{|\\vec{u}|}$$</div>
                                    </div>
                                    <p class="text-sm text-creme-200 mt-3">Direkt einsetzen, kein Gleichungssystem.</p>
                                    <p class="text-xs text-red-300 mt-2"><strong>Liefert keine Fußpunkte.</strong></p>
                                </div>
                            </div>

                            <div class="bg-red-900/20 border border-red-500/30 rounded-xl p-4 mt-6">
                                <strong class="text-red-300 block mb-1">Erst prüfen, dann rechnen!</strong>
                                <p class="text-sm text-creme-200">Beide Formeln gelten nur, wenn die Richtungsvektoren wirklich <strong class="text-white">kollinear</strong> sind. Und Vorsicht: Sind die Geraden <strong class="text-white">identisch</strong>, ist der Abstand $0$ &ndash; das erkennt man daran, dass die Punktprobe von $B$ auf $g$ aufgeht.</p>
                            </div>
                        </div>

                        <div class="bg-mocha-900 border-2 border-gold-500/30 rounded-2xl p-6 md:p-8 shadow-lg">
                            <div class="flex items-center gap-2 mb-4">
                                <span class="bg-gold-500 text-mocha-900 font-bold px-3 py-1 rounded-lg text-sm">Beispiel C</span>
                            </div>
                            <p class="text-creme-100 mb-5">$g: \\vec{x} = \\begin{pmatrix} 1 \\\\ 2 \\\\ 3 \\end{pmatrix} + r \\begin{pmatrix} 2 \\\\ 1 \\\\ -2 \\end{pmatrix}$ und $h: \\vec{x} = \\begin{pmatrix} 4 \\\\ 5 \\\\ 3 \\end{pmatrix} + s \\begin{pmatrix} 2 \\\\ 1 \\\\ -2 \\end{pmatrix}$</p>

                            <div class="bg-mocha-800 p-4 rounded-xl border-l-4 border-blue-500 mb-4">
                                <strong class="text-blue-400 block mb-1">Schritt 0: Parallelität sichern</strong>
                                <p class="text-sm text-creme-200">Die Richtungsvektoren sind identisch, also kollinear. Punktprobe: Liegt $B(4|5|3)$ auf $g$? Zeile I liefert $4 = 1+2r \\Rightarrow r = 1{,}5$, Zeile II aber $5 = 2 + r \\Rightarrow r = 3$. Widerspruch &ndash; die Geraden sind <strong class="text-white">echt parallel</strong>.</p>
                            </div>

                            <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
                                <div class="bg-mocha-800 p-5 rounded-xl border-l-4 border-green-500">
                                    <strong class="text-green-400 block mb-2">Weg C1</strong>
                                    <p class="text-sm text-creme-200 mb-2">Das ist exakt die Rechnung aus Beispiel B mit $B(4|5|3)$:</p>
                                    <div class="text-sm font-mono bg-mocha-900 p-3 rounded-lg border border-mocha-600 text-creme-100 space-y-1">
                                        <div>$9r - 9 = 0 \\Rightarrow r = 1$</div>
                                        <div>$F(3|3|1)$</div>
                                        <div>$d = |\\vec{BF}| = 3$</div>
                                    </div>
                                </div>
                                <div class="bg-mocha-800 p-5 rounded-xl border-l-4 border-amber-500">
                                    <strong class="text-amber-400 block mb-2">Weg C2</strong>
                                    <p class="text-sm text-creme-200 mb-2">$\\vec{AB} = \\begin{pmatrix} 3 \\\\ 3 \\\\ 0 \\end{pmatrix}$, Kreuzprodukt wie in B3:</p>
                                    <div class="math-box text-center text-creme-100 text-sm">$$d = \\frac{|\\vec{AB} \\times \\vec{u}|}{|\\vec{u}|} = \\frac{9}{3} = 3$$</div>
                                    <p class="text-xs text-creme-300 mt-2">Beide Wege: $d = 3$ &#10003;</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- ================= D: Windschiefe Geraden ================= -->
                    <div id="sec17D">
                        <h3 class="text-2xl font-bold text-white mb-2 border-b border-mocha-600 pb-2">D. Abstand windschiefer Geraden</h3>
                        <p class="text-creme-300 text-sm mb-6">Die Königsdisziplin &ndash; und der einzige Fall, in dem sich die drei Verfahren wirklich unterscheiden.</p>

                        <div class="bg-mocha-800 p-6 rounded-2xl shadow-lg border border-mocha-600 mb-8">
                            <div class="grid grid-cols-1 lg:grid-cols-5 gap-8 items-stretch">
                                <div class="lg:col-span-2 flex flex-col items-center order-2 lg:order-1">
                                    <h4 class="font-bold text-creme-200 mb-2">Visualisierung: Windschief</h4>
                                    <div class="relative w-full flex-1 min-h-[300px] bg-mocha-900 rounded-xl overflow-hidden border border-mocha-500 shadow-inner">
                                        <canvas id="distSkewCanvas" class="absolute top-0 left-0 w-full h-full"></canvas>
                                    </div>
                                </div>
                                <div class="lg:col-span-3 order-1 lg:order-2">
                                    <div class="bg-mocha-900 p-5 rounded-xl border-l-4 border-gold-500 shadow-inner mb-4">
                                        <strong class="text-white block mb-2 text-lg">Das gemeinsame Lot</strong>
                                        <p class="text-sm text-creme-200 mb-2">Zwischen zwei windschiefen Geraden gibt es <strong class="text-white">genau eine</strong> Strecke, die auf beiden senkrecht steht: das <strong class="text-white">gemeinsame Lot</strong>. Seine Länge ist der gesuchte Abstand.</p>
                                        <p class="text-sm text-creme-200">Da diese Strecke senkrecht auf $\\vec{u}$ <em>und</em> auf $\\vec{v}$ steht, zeigt sie in Richtung $\\vec{u} \\times \\vec{v}$ &ndash; das ist der rote Faden aller drei Verfahren.</p>
                                    </div>
                                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                        <div class="bg-mocha-900 p-3 rounded-xl border border-mocha-600 text-center">
                                            <strong class="text-blue-400 block text-sm mb-1">D1 Hilfsebene</strong>
                                            <span class="text-xs text-creme-200">+ HNF</span>
                                        </div>
                                        <div class="bg-mocha-900 p-3 rounded-xl border border-gold-500/40 text-center">
                                            <strong class="text-gold-400 block text-sm mb-1">D2 Vektorzug</strong>
                                            <span class="text-xs text-creme-200">+ LGS, mit Fußpunkten</span>
                                        </div>
                                        <div class="bg-mocha-900 p-3 rounded-xl border border-mocha-600 text-center">
                                            <strong class="text-amber-400 block text-sm mb-1">D3 Spatprodukt</strong>
                                            <span class="text-xs text-creme-200">Einzeiler</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- gemeinsame Aufgabenstellung -->
                        <div class="bg-amber-900/20 border border-amber-500/40 rounded-2xl p-5 mb-8">
                            <strong class="text-gold-400 block mb-2">Durchgehendes Beispiel D</strong>
                            <p class="text-creme-100 text-sm mb-3">Alle drei Verfahren rechnen wir am selben Paar durch:</p>
                            <div class="math-box text-center text-creme-100">$$g: \\vec{x} = \\begin{pmatrix} 1 \\\\ 2 \\\\ 3 \\end{pmatrix} + r \\begin{pmatrix} 2 \\\\ 1 \\\\ -2 \\end{pmatrix} \\qquad h: \\vec{x} = \\begin{pmatrix} 6 \\\\ -3 \\\\ 1 \\end{pmatrix} + s \\begin{pmatrix} 1 \\\\ 2 \\\\ 2 \\end{pmatrix}$$</div>
                            <p class="text-xs text-creme-300 mt-3 text-center">Die Richtungsvektoren sind nicht kollinear und das Gleichsetzen führt auf einen Widerspruch &ndash; die Geraden sind windschief.</p>
                        </div>

                        <!-- D1 -->
                        <div class="bg-mocha-800 p-6 md:p-8 rounded-2xl shadow-lg border border-mocha-600 mb-8">
                            <h4 class="text-xl font-bold text-blue-400 mb-4">D1 &ndash; Hilfsebene + Hesse'sche Normalenform</h4>
                            <div class="bg-mocha-900 p-5 rounded-xl border border-mocha-600 space-y-3 text-sm text-creme-200 mb-5">
                                <p><strong class="text-white">1. Hilfsebene $E_H$ aufstellen:</strong> Sie enthält $g$ und ist parallel zu $h$. Stützvektor = Stützvektor von $g$, Spannvektoren = <strong class="text-white">beide</strong> Richtungsvektoren $\\vec{u}$ und $\\vec{v}$.</p>
                                <p><strong class="text-white">2. Reduktion:</strong> Weil $h$ nun überall parallel zu $E_H$ verläuft, ist der Abstand von $h$ zu $E_H$ genau der gesuchte Geradenabstand.</p>
                                <p><strong class="text-white">3. HNF anwenden:</strong> Berechne den Abstand des Stützpunktes $B$ von $h$ zur Ebene $E_H$ &ndash; mit der Formel aus Teil A.</p>
                            </div>

                            <div class="space-y-4">
                                <div class="bg-mocha-900 p-4 rounded-xl border-l-4 border-blue-500">
                                    <strong class="text-blue-400 block mb-2">Normalenvektor der Hilfsebene</strong>
                                    <div class="math-box text-center text-creme-100">$$\\vec{n} = \\vec{u} \\times \\vec{v} = \\begin{pmatrix} 2 \\\\ 1 \\\\ -2 \\end{pmatrix} \\times \\begin{pmatrix} 1 \\\\ 2 \\\\ 2 \\end{pmatrix} = \\begin{pmatrix} 6 \\\\ -6 \\\\ 3 \\end{pmatrix}$$</div>
                                    <p class="text-sm text-creme-200 mt-2 text-center">Wir kürzen mit 3 zu $\\vec{n} = \\begin{pmatrix} 2 \\\\ -2 \\\\ 1 \\end{pmatrix}$, also $|\\vec{n}| = 3$.</p>
                                </div>
                                <div class="bg-mocha-900 p-4 rounded-xl border-l-4 border-green-500">
                                    <strong class="text-green-400 block mb-2">Koordinatenform von $E_H$</strong>
                                    <p class="text-sm text-creme-200 mb-2">Stützpunkt $A(1|2|3)$ einsetzen: $2(1) - 2(2) + 3 = 1$</p>
                                    <div class="math-box text-center text-gold-300">$$E_H: 2x_1 - 2x_2 + x_3 = 1$$</div>
                                </div>
                                <div class="bg-mocha-900 p-4 rounded-xl border-l-4 border-gold-500">
                                    <strong class="text-gold-400 block mb-2">Abstand von $B(6|-3|1)$ zu $E_H$</strong>
                                    <div class="math-box text-center text-gold-300 font-bold">$$d = \\frac{|2 \\cdot 6 - 2 \\cdot (-3) + 1 - 1|}{3} = \\frac{|12 + 6 + 1 - 1|}{3} = \\frac{18}{3} = 6$$</div>
                                </div>
                            </div>
                        </div>

                        <!-- D2 Vektorzug -->
                        <div class="bg-mocha-800 p-6 md:p-8 rounded-2xl shadow-lg border-2 border-gold-500/40 mb-8">
                            <div class="flex items-center gap-3 mb-4">
                                <h4 class="text-xl font-bold text-gold-400">D2 &ndash; Der geschlossene Vektorzug</h4>
                                <span class="bg-gold-500/20 text-gold-300 text-xs font-bold px-2 py-1 rounded border border-gold-500/40">liefert die Fußpunkte</span>
                            </div>

                            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
                                <div>
                                    <div class="bg-mocha-900 p-5 rounded-xl border-l-4 border-gold-500 shadow-inner mb-4">
                                        <strong class="text-white block mb-2">Die Idee: eine Rundreise, die bei null endet</strong>
                                        <p class="text-sm text-creme-200 mb-2">Wir laufen im Kreis: von $A$ ein Stück auf $g$ zum Fußpunkt $F_g$, dann über das Lot zu $F_h$, dann auf $h$ zurück zu $B$ und schließlich von $B$ direkt zurück zu $A$. Wir sind wieder am Start &ndash; die Vektorkette summiert sich also zu null:</p>
                                        <div class="math-box text-center text-gold-300 font-bold text-sm mt-3">$$r\\,\\vec{u} + \\vec{w} - s\\,\\vec{v} - \\vec{AB} = \\vec{0}$$</div>
                                    </div>
                                    <p class="text-sm text-creme-200 mb-3">Nach dem Verbindungsvektor $\\vec{w}$ zwischen den beiden Fußpunkten aufgelöst heißt das:</p>
                                    <div class="bg-amber-900/30 border-l-4 border-amber-500 p-4 rounded-r-xl border-y border-r border-amber-500/30">
                                        <div class="math-box text-center text-gold-300 font-bold">$$\\vec{w}(r,s) = \\vec{AB} + s\\,\\vec{v} - r\\,\\vec{u}$$</div>
                                    </div>
                                </div>

                                <div class="bg-mocha-900 rounded-xl border border-mocha-600 p-5 flex flex-col justify-center">
                                    <svg viewBox="0 0 320 220" class="w-full">
                                        <defs>
                                            <marker id="arrVZ1" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#60a5fa" /></marker>
                                            <marker id="arrVZ2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4ade80" /></marker>

                                    <p class="text-xs text-creme-300 text-center mt-3">Der geschlossene Zug $A \\to F_g \\to F_h \\to B \\to A$</p>

                            </div>

                            <div class="bg-mocha-900 p-5 rounded-xl border border-mocha-600 mb-6">
                                <strong class="text-white block mb-3">Die zwei Bedingungen</strong>
                                <p class="text-sm text-creme-200 mb-3">$\\vec{w}$ ist das gemeinsame Lot &ndash; es muss also auf <strong class="text-white">beiden</strong> Richtungsvektoren senkrecht stehen. Das sind genau zwei Gleichungen für die zwei Unbekannten $r$ und $s$:</p>
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    <div class="bg-mocha-800 p-4 rounded-lg border border-mocha-600">
                                        <div class="math-box text-center text-gold-300 font-bold">$$\\vec{w} \\cdot \\vec{u} = 0$$</div>
                                    </div>
                                    <div class="bg-mocha-800 p-4 rounded-lg border border-mocha-600">
                                        <div class="math-box text-center text-gold-300 font-bold">$$\\vec{w} \\cdot \\vec{v} = 0$$</div>
                                    </div>
                                </div>
                                <p class="text-sm text-creme-200 mt-3">Ein $2 \\times 2$-LGS &ndash; und danach kennt man nicht nur den Abstand, sondern auch <strong class="text-white">die beiden Punkte, an denen die Geraden einander am nächsten kommen</strong>.</p>
                            </div>

                            <div class="space-y-4">
                                <div class="bg-mocha-900 p-4 rounded-xl border-l-4 border-blue-500">
                                    <strong class="text-blue-400 block mb-2">Schritt 1: $\\vec{w}$ allgemein aufstellen</strong>
                                    <p class="text-sm text-creme-200 mb-2">Mit $\\vec{AB} = \\begin{pmatrix} 5 \\\\ -5 \\\\ -2 \\end{pmatrix}$:</p>
                                    <div class="math-box text-center text-creme-100">$$\\vec{w} = \\begin{pmatrix} 5 \\\\ -5 \\\\ -2 \\end{pmatrix} + s \\begin{pmatrix} 1 \\\\ 2 \\\\ 2 \\end{pmatrix} - r \\begin{pmatrix} 2 \\\\ 1 \\\\ -2 \\end{pmatrix} = \\begin{pmatrix} 5 + s - 2r \\\\ -5 + 2s - r \\\\ -2 + 2s + 2r \\end{pmatrix}$$</div>
                                </div>

                                <div class="bg-mocha-900 p-4 rounded-xl border-l-4 border-green-500">
                                    <strong class="text-green-400 block mb-2">Schritt 2: Das LGS aufstellen</strong>
                                    <div class="text-sm text-creme-200 space-y-2">
                                        <p><strong class="text-white">I:</strong> $\\vec{w} \\cdot \\vec{u} = 0$</p>
                                        <div class="font-mono bg-mocha-800 p-3 rounded-lg border border-mocha-600 text-creme-100 text-xs space-y-1">
                                            <div>$2(5+s-2r) + 1(-5+2s-r) - 2(-2+2s+2r) = 0$</div>
                                            <div>$9 - 9r = 0$</div>
                                        </div>
                                        <p class="mt-3"><strong class="text-white">II:</strong> $\\vec{w} \\cdot \\vec{v} = 0$</p>
                                        <div class="font-mono bg-mocha-800 p-3 rounded-lg border border-mocha-600 text-creme-100 text-xs space-y-1">
                                            <div>$1(5+s-2r) + 2(-5+2s-r) + 2(-2+2s+2r) = 0$</div>
                                            <div>$-9 + 9s = 0$</div>
                                        </div>
                                    </div>
                                    <div class="bg-amber-900/20 border border-amber-500/30 rounded-lg p-3 mt-3">
                                        <p class="text-xs text-creme-200">Hier fallen die gemischten Terme weg, weil zufällig $\\vec{u} \\cdot \\vec{v} = 0$ gilt. <strong class="text-white">Im Normalfall</strong> stehen in beiden Gleichungen sowohl $r$ als auch $s$ &ndash; dann löst man das $2 \\times 2$-System wie gewohnt mit dem Additionsverfahren.</p>
                                    </div>
                                </div>

                                <div class="bg-mocha-900 p-4 rounded-xl border-l-4 border-purple-500">
                                    <strong class="text-purple-400 block mb-2">Schritt 3: Die Lotfußpunkte</strong>
                                    <p class="text-sm text-creme-200 mb-2">Aus dem LGS: $r = 1$ und $s = 1$. Einsetzen in die Geraden:</p>
                                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                        <div class="bg-mocha-800 p-3 rounded-lg border border-mocha-600">
                                            <div class="math-box text-center text-creme-100 text-sm">$$\\vec{f_g} = \\begin{pmatrix} 1 \\\\ 2 \\\\ 3 \\end{pmatrix} + 1 \\cdot \\begin{pmatrix} 2 \\\\ 1 \\\\ -2 \\end{pmatrix} = \\begin{pmatrix} 3 \\\\ 3 \\\\ 1 \\end{pmatrix}$$</div>
                                            <p class="text-center text-gold-300 font-bold text-sm mt-1">$F_g(3|3|1)$</p>
                                        </div>
                                        <div class="bg-mocha-800 p-3 rounded-lg border border-mocha-600">
                                            <div class="math-box text-center text-creme-100 text-sm">$$\\vec{f_h} = \\begin{pmatrix} 6 \\\\ -3 \\\\ 1 \\end{pmatrix} + 1 \\cdot \\begin{pmatrix} 1 \\\\ 2 \\\\ 2 \\end{pmatrix} = \\begin{pmatrix} 7 \\\\ -1 \\\\ 3 \\end{pmatrix}$$</div>
                                            <p class="text-center text-gold-300 font-bold text-sm mt-1">$F_h(7|-1|3)$</p>
                                        </div>
                                    </div>
                                </div>

                                <div class="bg-mocha-900 p-4 rounded-xl border-l-4 border-gold-500">
                                    <strong class="text-gold-400 block mb-2">Schritt 4: Der Abstand</strong>
                                    <div class="math-box text-center text-creme-100">$$\\vec{w} = \\vec{f_h} - \\vec{f_g} = \\begin{pmatrix} 4 \\\\ -4 \\\\ 2 \\end{pmatrix}$$</div>
                                    <div class="math-box text-center text-gold-300 font-bold mt-2">$$d = \\sqrt{16 + 16 + 4} = \\sqrt{36} = 6$$</div>
                                    <p class="text-xs text-creme-300 mt-3 text-center">Kontrolle: $\\vec{w}$ ist ein Vielfaches von $\\vec{n} = \\begin{pmatrix} 2 \\\\ -2 \\\\ 1 \\end{pmatrix}$ &ndash; das gemeinsame Lot zeigt tatsächlich in Richtung $\\vec{u} \\times \\vec{v}$. &#10003;</p>
                                </div>
                            </div>
                        </div>

                        <!-- D3 -->
                        <div class="bg-mocha-800 p-6 md:p-8 rounded-2xl shadow-lg border border-mocha-600 mb-8">
                            <h4 class="text-xl font-bold text-amber-500 mb-4">D3 &ndash; Die Spatprodukt-Formel</h4>
                            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 items-center">
                                <div>
                                    <p class="text-sm text-creme-200 mb-3">Fasst man D1 in eine einzige Formel zusammen, erhält man den <strong class="text-white">Einzeiler</strong>: Man projiziert den Verbindungsvektor $\\vec{AB}$ auf die Richtung des gemeinsamen Lots.</p>
                                    <div class="bg-amber-900/30 border-l-4 border-amber-500 p-4 rounded-r-xl border-y border-r border-amber-500/30">
                                        <div class="math-box text-center text-gold-300 font-bold text-lg">$$d = \\frac{|\\vec{AB} \\cdot (\\vec{u} \\times \\vec{v})|}{|\\vec{u} \\times \\vec{v}|}$$</div>
                                    </div>
                                    <p class="text-xs text-creme-300 mt-3">Der Zähler heißt <strong class="text-white">Spatprodukt</strong> und ist das Volumen des von $\\vec{AB}$, $\\vec{u}$ und $\\vec{v}$ aufgespannten Spats. Geteilt durch die Grundfläche $|\\vec{u} \\times \\vec{v}|$ bleibt die Höhe &ndash; der Abstand.</p>
                                </div>
                                <div class="bg-mocha-900 p-5 rounded-xl border border-mocha-600">
                                    <strong class="text-white block mb-2 text-sm">Am Beispiel D</strong>
                                    <div class="math-box text-center text-creme-100 text-sm">$$\\vec{AB} \\cdot (\\vec{u} \\times \\vec{v}) = \\begin{pmatrix} 5 \\\\ -5 \\\\ -2 \\end{pmatrix} \\cdot \\begin{pmatrix} 6 \\\\ -6 \\\\ 3 \\end{pmatrix} = 54$$</div>
                                    <div class="math-box text-center text-creme-100 text-sm mt-2">$$|\\vec{u} \\times \\vec{v}| = \\sqrt{36+36+9} = 9$$</div>
                                    <div class="math-box text-center text-gold-300 font-bold mt-2">$$d = \\frac{54}{9} = 6 \\quad \\checkmark$$</div>
                                </div>
                            </div>
                            <div class="bg-blue-900/20 border border-blue-500/30 rounded-xl p-4 mt-5">
                                <p class="text-sm text-creme-200"><strong class="text-blue-300">Praktischer Nebeneffekt:</strong> Ist das Spatprodukt $= 0$, liegen $\\vec{AB}$, $\\vec{u}$ und $\\vec{v}$ in einer Ebene. Die Geraden sind dann <strong class="text-white">nicht</strong> windschief, sondern schneiden sich (oder sind parallel). Das Spatprodukt ist also gleichzeitig ein Windschief-Test.</p>
                            </div>
                        </div>

                        <!-- Vergleichstabelle D -->
                        <div class="bg-mocha-800 p-6 md:p-8 rounded-2xl shadow-lg border border-mocha-600">
                            <h4 class="text-xl font-bold text-white mb-4">Welches Verfahren wann?</h4>
                            <div class="overflow-x-auto">
                                <table class="w-full text-sm border-collapse min-w-[640px]">
                                    <thead>
                                        <tr class="bg-mocha-900">
                                            <th class="text-left p-3 text-gold-400 border border-mocha-600">Verfahren</th>
                                            <th class="text-left p-3 text-gold-400 border border-mocha-600">Aufwand</th>
                                            <th class="text-left p-3 text-gold-400 border border-mocha-600">Liefert Fußpunkte?</th>
                                            <th class="text-left p-3 text-gold-400 border border-mocha-600">Ideal bei</th>
                                        </tr>
                                    </thead>
                                    <tbody class="text-creme-200">
                                        <tr>
                                            <td class="p-3 border border-mocha-600"><strong class="text-blue-400">D1</strong> Hilfsebene + HNF</td>
                                            <td class="p-3 border border-mocha-600">mittel</td>
                                            <td class="p-3 border border-mocha-600"><span class="text-red-300">nein</span></td>
                                            <td class="p-3 border border-mocha-600">"Berechne den Abstand." (klassischer Abiweg)</td>
                                        </tr>
                                        <tr class="bg-mocha-900/50">
                                            <td class="p-3 border border-mocha-600"><strong class="text-gold-400">D2</strong> Vektorzug + LGS</td>
                                            <td class="p-3 border border-mocha-600">hoch</td>
                                            <td class="p-3 border border-mocha-600"><span class="text-green-300">ja, beide</span></td>
                                            <td class="p-3 border border-mocha-600">"Wo kommen sich die Geraden am nächsten?", Sachaufgaben (Flugbahnen)</td>
                                        </tr>
                                        <tr>
                                            <td class="p-3 border border-mocha-600"><strong class="text-amber-400">D3</strong> Spatprodukt</td>
                                            <td class="p-3 border border-mocha-600">gering</td>
                                            <td class="p-3 border border-mocha-600"><span class="text-red-300">nein</span></td>
                                            <td class="p-3 border border-mocha-600">schnelle Kontrolle des eigenen Ergebnisses</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                            <div class="bg-amber-900/20 border border-amber-500/30 rounded-xl p-4 mt-5">
                                <strong class="text-gold-300 block mb-1">Merksatz fürs Abitur</strong>
                                <p class="text-sm text-creme-200">Fragt die Aufgabe nur nach einer <strong class="text-white">Zahl</strong>, nimm D1 oder D3. Fragt sie nach <strong class="text-white">Punkten</strong> &ndash; "an welcher Stelle", "wo genau", "zu welchem Zeitpunkt" &ndash;, führt kein Weg an D2 vorbei.</p>
                            </div>
                        </div>
                    </div>
                </div>`;
            let exercises = [
                {
                    q: "Berechne den Abstand des Punktes $P(2|1|4)$ zur Ebene $E: 2x_1 - 2x_2 + x_3 = 6$ mithilfe der Hesse'schen Normalenform.",
                    a: "1. Länge des Normalenvektors $\\vec{n} = \\begin{pmatrix} 2 \\\\ -2 \\\\ 1 \\end{pmatrix}$:<br>$|\\vec{n}| = \\sqrt{4+4+1} = 3$<br><br>2. Einsetzen in die Betragsformel:<br>$d = \\frac{|2(2) - 2(1) + 4 - 6|}{3} = \\frac{|0|}{3} = 0$<br><br><strong class='text-gold-300'>Der Abstand ist 0 &ndash; der Punkt liegt direkt in der Ebene!</strong>"
                },
                {
                    q: "Bestimme den Lotfußpunkt $F$ und den Spiegelpunkt $P'$ von $P(3|6|6)$ bezüglich der Ebene $E: x_1 + 2x_2 + 2x_3 = 9$.",
                    a: "<strong class='text-white'>1. Lotgerade:</strong> $h: \\vec{x} = \\begin{pmatrix} 3 \\\\ 6 \\\\ 6 \\end{pmatrix} + t \\begin{pmatrix} 1 \\\\ 2 \\\\ 2 \\end{pmatrix}$<br><br><strong class='text-white'>2. Schnitt mit E:</strong><br>$(3+t) + 2(6+2t) + 2(6+2t) = 9$<br>$3 + t + 12 + 4t + 12 + 4t = 9$<br>$27 + 9t = 9 \\Rightarrow t = -2$<br><br><strong class='text-white'>3. Lotfußpunkt:</strong><br>$\\vec{f} = \\begin{pmatrix} 3 \\\\ 6 \\\\ 6 \\end{pmatrix} - 2\\begin{pmatrix} 1 \\\\ 2 \\\\ 2 \\end{pmatrix} = \\begin{pmatrix} 1 \\\\ 2 \\\\ 2 \\end{pmatrix} \\Rightarrow$ <strong class='text-gold-300'>$F(1|2|2)$</strong><br><br><strong class='text-white'>4. Abstand und Spiegelpunkt:</strong><br>$\\vec{PF} = \\begin{pmatrix} -2 \\\\ -4 \\\\ -4 \\end{pmatrix}$, also $d = \\sqrt{4+16+16} = 6$<br>$\\vec{p'} = \\vec{p} + 2\\vec{PF} = \\begin{pmatrix} 3 \\\\ 6 \\\\ 6 \\end{pmatrix} + \\begin{pmatrix} -4 \\\\ -8 \\\\ -8 \\end{pmatrix} \\Rightarrow$ <strong class='text-gold-300'>$P'(-1|-2|-2)$</strong>"
                },
                {
                    q: "Berechne den Abstand des Punktes $P(4|0|5)$ zur Geraden $g: \\vec{x} = \\begin{pmatrix} 1 \\\\ 0 \\\\ 2 \\end{pmatrix} + r \\begin{pmatrix} 2 \\\\ 2 \\\\ 1 \\end{pmatrix}$ &ndash; einmal über den Laufpunkt und einmal über die Flächenformel.",
                    a: "<strong class='text-white'>Weg 1 (Laufpunkt):</strong><br>$\\vec{f}(r) - \\vec{p} = \\begin{pmatrix} 1+2r-4 \\\\ 2r \\\\ 2+r-5 \\end{pmatrix} = \\begin{pmatrix} 2r-3 \\\\ 2r \\\\ r-3 \\end{pmatrix}$<br>Bedingung $(\\vec{f}(r)-\\vec{p}) \\cdot \\vec{u} = 0$:<br>$2(2r-3) + 2(2r) + (r-3) = 9r - 9 = 0 \\Rightarrow r = 1$<br>$F(3|2|3)$, $\\vec{PF} = \\begin{pmatrix} -1 \\\\ 2 \\\\ -2 \\end{pmatrix}$, also $d = \\sqrt{1+4+4} = $ <strong class='text-gold-300'>$3$</strong><br><br><strong class='text-white'>Weg 2 (Flächenformel):</strong><br>$\\vec{AP} = \\begin{pmatrix} 3 \\\\ 0 \\\\ 3 \\end{pmatrix}$, $\\vec{AP} \\times \\vec{u} = \\begin{pmatrix} 0 \\cdot 1 - 3 \\cdot 2 \\\\ 3 \\cdot 2 - 3 \\cdot 1 \\\\ 3 \\cdot 2 - 0 \\cdot 2 \\end{pmatrix} = \\begin{pmatrix} -6 \\\\ 3 \\\\ 6 \\end{pmatrix}$<br>$|\\vec{AP} \\times \\vec{u}| = \\sqrt{36+9+36} = 9$ und $|\\vec{u}| = 3$<br>$d = \\frac{9}{3} = $ <strong class='text-gold-300'>$3$</strong> &ndash; beide Wege stimmen überein."
                },
                {
                    q: "Zeige, dass $g: \\vec{x} = \\begin{pmatrix} 1 \\\\ 0 \\\\ 2 \\end{pmatrix} + r \\begin{pmatrix} 2 \\\\ 2 \\\\ 1 \\end{pmatrix}$ und $h: \\vec{x} = \\begin{pmatrix} 4 \\\\ 0 \\\\ 5 \\end{pmatrix} + s \\begin{pmatrix} 4 \\\\ 4 \\\\ 2 \\end{pmatrix}$ echt parallel sind, und berechne ihren Abstand.",
                    a: "<strong class='text-white'>1. Parallelität:</strong> $\\begin{pmatrix} 4 \\\\ 4 \\\\ 2 \\end{pmatrix} = 2 \\cdot \\begin{pmatrix} 2 \\\\ 2 \\\\ 1 \\end{pmatrix}$ &ndash; die Richtungsvektoren sind kollinear.<br><br><strong class='text-white'>2. Echt parallel oder identisch?</strong> Punktprobe mit $B(4|0|5)$ auf $g$:<br>I: $4 = 1+2r \\Rightarrow r = 1{,}5$<br>II: $0 = 2r \\Rightarrow r = 0$<br>Widerspruch &rArr; <strong class='text-gold-300'>echt parallel</strong>.<br><br><strong class='text-white'>3. Abstand</strong> (Punkt $B$ zur Geraden $g$, Flächenformel):<br>$\\vec{AB} = \\begin{pmatrix} 3 \\\\ 0 \\\\ 3 \\end{pmatrix}$, $|\\vec{AB} \\times \\vec{u}| = 9$, $|\\vec{u}| = 3$<br>$d = \\frac{9}{3} = $ <strong class='text-gold-300'>$3$</strong><br><br><em class='text-mocha-300'>Achtung: In der Formel muss der Richtungsvektor stehen, dessen Länge man auch im Nenner verwendet &ndash; hier durchgehend $\\vec{u}$.</em>"
                },
                {
                    q: "Berechne den Abstand der windschiefen Geraden $g: \\vec{x} = r \\begin{pmatrix} 1 \\\\ 2 \\\\ 2 \\end{pmatrix}$ und $h: \\vec{x} = \\begin{pmatrix} 3 \\\\ 6 \\\\ -3 \\end{pmatrix} + s \\begin{pmatrix} 2 \\\\ -2 \\\\ 1 \\end{pmatrix}$ mit der Spatprodukt-Formel.",
                    a: "<strong class='text-white'>1. Kreuzprodukt der Richtungsvektoren:</strong><br>$\\vec{u} \\times \\vec{v} = \\begin{pmatrix} 2 \\cdot 1 - 2 \\cdot (-2) \\\\ 2 \\cdot 2 - 1 \\cdot 1 \\\\ 1 \\cdot (-2) - 2 \\cdot 2 \\end{pmatrix} = \\begin{pmatrix} 6 \\\\ 3 \\\\ -6 \\end{pmatrix}$<br>$|\\vec{u} \\times \\vec{v}| = \\sqrt{36+9+36} = 9$<br><br><strong class='text-white'>2. Spatprodukt:</strong> mit $\\vec{AB} = \\begin{pmatrix} 3 \\\\ 6 \\\\ -3 \\end{pmatrix}$<br>$\\vec{AB} \\cdot (\\vec{u} \\times \\vec{v}) = 18 + 18 + 18 = 54$<br><br><strong class='text-white'>3. Abstand:</strong><br>$d = \\frac{|54|}{9} = $ <strong class='text-gold-300'>$6$</strong><br><br>Da das Spatprodukt nicht null ist, sind die Geraden tatsächlich windschief."
                },
                {
                    q: "Bestimme für dieselben Geraden $g: \\vec{x} = r \\begin{pmatrix} 1 \\\\ 2 \\\\ 2 \\end{pmatrix}$ und $h: \\vec{x} = \\begin{pmatrix} 3 \\\\ 6 \\\\ -3 \\end{pmatrix} + s \\begin{pmatrix} 2 \\\\ -2 \\\\ 1 \\end{pmatrix}$ die beiden Punkte, an denen sich die Geraden am nächsten kommen.",
                    a: "Wir brauchen den Vektorzug (Verfahren D2).<br><br><strong class='text-white'>1. Verbindungsvektor der Laufpunkte:</strong><br>$\\vec{w} = \\vec{AB} + s\\vec{v} - r\\vec{u} = \\begin{pmatrix} 3+2s-r \\\\ 6-2s-2r \\\\ -3+s-2r \\end{pmatrix}$<br><br><strong class='text-white'>2. Beide Orthogonalitätsbedingungen:</strong><br>I: $\\vec{w} \\cdot \\vec{u} = 0$<br>$(3+2s-r) + 2(6-2s-2r) + 2(-3+s-2r) = 9 - 9r = 0 \\Rightarrow r = 1$<br><br>II: $\\vec{w} \\cdot \\vec{v} = 0$<br>$2(3+2s-r) - 2(6-2s-2r) + (-3+s-2r) = -9 + 9s = 0 \\Rightarrow s = 1$<br><br><strong class='text-white'>3. Die Fußpunkte:</strong><br>$\\vec{f_g} = 1 \\cdot \\begin{pmatrix} 1 \\\\ 2 \\\\ 2 \\end{pmatrix} \\Rightarrow$ <strong class='text-gold-300'>$F_g(1|2|2)$</strong><br>$\\vec{f_h} = \\begin{pmatrix} 3 \\\\ 6 \\\\ -3 \\end{pmatrix} + \\begin{pmatrix} 2 \\\\ -2 \\\\ 1 \\end{pmatrix} \\Rightarrow$ <strong class='text-gold-300'>$F_h(5|4|-2)$</strong><br><br><strong class='text-white'>4. Kontrolle:</strong> $\\vec{w} = \\begin{pmatrix} 4 \\\\ 2 \\\\ -4 \\end{pmatrix}$, $d = \\sqrt{16+4+16} = 6$ &ndash; passt zum Ergebnis der Spatprodukt-Formel. &#10003;"
                },
                {
                    q: "Wann haben zwei windschiefe Geraden den Abstand null?",
                    a: "Windschiefe Geraden haben nach Definition <strong>niemals</strong> den Abstand null. Wäre der Abstand null, hätten sie einen gemeinsamen Punkt und würden sich schneiden. Da \"windschief\" aber genau bedeutet, dass sie sich weder schneiden noch parallel sind, ist ihr Abstand immer strikt größer als null.<br><br>Rechnerisch sieht man das am Spatprodukt: Ist $\\vec{AB} \\cdot (\\vec{u} \\times \\vec{v}) = 0$, so liegen die Geraden in einer gemeinsamen Ebene &ndash; sie sind dann eben <strong class='text-gold-300'>nicht</strong> windschief."
                }
            ];
            return html + renderExercises(exercises);
        }

        // --- Canvas Zeichenfunktionen ---

        function initCanvas() {
            const canvas = document.getElementById('coordCanvas');
            const size = getRealCanvasSize(canvas);
            if (!size) return;
